[project]
name = "aurum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "edgartools==5.53.0",
    "pandas==3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "psycopg2-binary>=2.9.12",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pytickertick>=1.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy==2.0.52",
    "tqdm==4.70.0",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=8.0",
    "jupyter>=1.1.1",
    "plotly>=6.9.0",
]
# dbt is a CLI, never imported by src/. Kept out of the default sync so CI's
# --no-build install path does not have to build dbt-core's sdist-only
# transitive dep (dbt-core-experimental-parser). Run it with: uv run --group dbt dbt ...
dbt = [
    "dbt-postgres>=1.11.0",
]
modeling = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "pyarrow>=25.0.0",
    "scikit-learn>=1.5",
    "scipy>=1.18.1",
]

[tool.ruff.lint.per-file-ignores]
"src/ingestion/runner.py" = ["F401"]
