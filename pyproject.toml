[project]
name = "aurum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "edgartools==5.53.0",
    "pandas==3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "psycopg2-binary>=2.9.12",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pytickertick>=1.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy==2.0.52",
    "tqdm==4.70.0",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=8.0",
    "jupyter>=1.1.1",
    "plotly>=6.9.0",
]

[tool.ruff.lint.per-file-ignores]
"src/ingestion/runner.py" = ["F401"]
