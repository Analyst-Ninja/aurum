sonar.projectKey=Analyst-Ninja_aurum
sonar.organization=analyst-ninja
sonar.python.version=3.12.11

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=aurum
#sonar.projectVersion=1.0


# Production code and test code must be declared separately. Without sonar.tests,
# tests/ is analysed as source and every one of its ~2.4k lines counts as uncovered
# (coverage.xml is produced with --cov=src), which dragged the project from 99% to 44%.
sonar.sources=src,main.py
sonar.tests=tests

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Exclude docs and notebooks from analysis. dbt models are Jinja-templated SQL; the
# PL/SQL analyser mis-parses them (illegal-character and duplicated-literal noise on
# what is really a templating construct), so they are excluded too.
sonar.exclusions=docs/**,nbs/**,src/transformation/**/*.sql
sonar.inclusions=src/**
sonar.python.coverage.reportPaths=coverage.xml