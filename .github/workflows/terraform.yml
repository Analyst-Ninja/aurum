name: Terraform

on:
  push:
    branches: [main]
    # Two kinds of change reach production through this workflow: the infrastructure
    # itself, and the application code baked into the image the task definitions run.
    # The second set is exactly what docker/aurum.Dockerfile COPYs, plus the lockfile.
    paths:
      - "infra/terraform/**"
      - "src/**"
      - "docker/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/deploy.sh"
  pull_request:
    # Validation only — a PR never builds or applies, so a code-only PR has nothing to
    # do here and stays on the CI workflow.
    paths:
      - "infra/terraform/**"
      - "scripts/deploy.sh"
  # Manual trigger. The path filter above means a workflow-only or docs-only change never
  # fires a run, so without this there is no way to apply after fixing the job itself —
  # and re-running an old run replays that commit's workflow file, bug and all.
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. The apply job widens this with id-token: write, which is
# what mints the OIDC token AWS exchanges for a session.
permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    name: Format, validate, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend — validation only)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Validate the bootstrap root
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Lint
        run: |
          tflint --init
          tflint --recursive --format compact

  apply:
    name: Apply (main only)
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # Serialize applies. The S3 backend takes a native lock (use_lockfile in versions.tf),
    # so a second run would hard-fail on the lock rather than queue. cancel-in-progress
    # stays false: killing a run mid-apply leaves the lock held and the state half-written.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # `git log -- <paths>` below walks history, so a depth-1 clone is not enough.
          fetch-depth: 0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::851459781998:role/aurum-github-actions
          aws-region: us-east-1

      # All of the steps that used to live here (resolve the image tag, build and push the
      # main and MCP images if their tags are missing, check secrets, init, apply) are in
      # scripts/deploy.sh, so `make tf-apply` on a laptop runs the identical sequence. It also
      # creates the ECR repo first, which is what lets this job deploy a cold account.
      - name: Deploy
        working-directory: ${{ github.workspace }}
        run: scripts/deploy.sh apply
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_sec_user_agent: ${{ secrets.TF_VAR_SEC_USER_AGENT }}
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          TF_VAR_mcp_password: ${{ secrets.TF_VAR_MCP_PASSWORD }}
