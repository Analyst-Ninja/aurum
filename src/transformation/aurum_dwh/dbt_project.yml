
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'aurum_dwh'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'aurum_dwh'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Medallion layers. `generate_schema_name` (macros/) is overridden so these
# schema names are used verbatim rather than prefixed with the profile schema.
#
# bronze/silver are incremental because they rebuild from append-only landing
# tables; gold is a full table because every consumer reads it repeatedly and
# the cross-sectional window functions are expensive to recompute per query.
models:
  aurum_dwh:
    bronze:
      +schema: bronze
      +materialized: incremental
    silver:
      +schema: silver
      +materialized: incremental
    gold:
      +schema: gold
      +materialized: table

vars:
  # Point-in-time guard. EDGAR ingestion carries no filed_date, so fundamentals
  # are treated as knowable at period_end + lag rather than at their true filing
  # date. Filings land ~43 days after period end and up to 61, so these sit
  # deliberately past that: over-lagging costs freshness, under-lagging invents
  # alpha that never existed. Replace with a filed_date join once ingested.
  fundamental_lag_days_quarterly: 60
  fundamental_lag_days_annual: 90

  # Risk-free rate for Sharpe (annual, decimal). Divided by 252 for daily use.
  risk_free_annual: 0.045

  # History re-read by incremental models carrying rolling windows. MUST exceed
  # the longest window (252d) with headroom for non-trading days. A shorter
  # value silently yields NULL long-window features on every incremental run.
  window_lookback_days: 400

  # Tradability filters applied when building the training set.
  min_price: 1.0
  min_adv_usd: 1000000
