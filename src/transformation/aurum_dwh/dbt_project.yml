
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'aurum_dwh'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'aurum_dwh'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Medallion layers. `generate_schema_name` (macros/) is overridden so these
# schema names are used verbatim rather than prefixed with the profile schema.
#
# bronze/silver are incremental because they rebuild from append-only landing
# tables; gold is a full table because every consumer reads it repeatedly and
# the cross-sectional window functions are expensive to recompute per query.
models:
  aurum_dwh:
    bronze:
      +schema: bronze
      +materialized: incremental
    silver:
      +schema: silver
      +materialized: incremental
    gold:
      +schema: gold
      +materialized: table

seeds:
  aurum_dwh:
    +schema: bronze

vars:
  # Point-in-time guard. EDGAR ingestion carries no filed_date, so fundamentals
  # are treated as knowable at period_end + lag rather than at their true filing
  # date. Filings land ~43 days after period end and up to 61, so these sit
  # deliberately past that: over-lagging costs freshness, under-lagging invents
  # alpha that never existed. Replace with a filed_date join once ingested.
  fundamental_lag_days_quarterly: 60
  fundamental_lag_days_annual: 90

  # Risk-free rate for Sharpe (annual, decimal). Divided by 252 for daily use.
  risk_free_annual: 0.045

  # History RE-READ by incremental models carrying rolling windows. This is the
  # input frame, not the output range - see window_rewrite_days below.
  #
  # Must exceed the longest EFFECTIVE window plus the rewrite tail, measured in
  # CALENDAR days. Two corrections are baked into this number:
  #
  #   1. 252 TRADING days is ~366 CALENDAR days. The original 400 left only
  #      ~23 trading days of usable tail.
  #   2. Windows COMPOUND when nested. max_drawdown_252d is a 252-row min over
  #      drawdown_252d, which is itself measured against a 252-row peak, so its
  #      effective history is 504 trading days - not 252. Sizing for 252 left it
  #      wrong by up to 0.39 on 2,472 of 11,113 recent rows.
  #
  # 900 calendar days is ~621 trading days: 559 of warm-up behind a
  # 62-trading-day tail, against the 504 actually required.
  #
  # THE RULE, stated correctly: a feature built from a window of N rows over a
  # value that itself spans M rows needs warm-up for N + M, and
  # window_lookback_days must cover that PLUS window_rewrite_days.
  window_lookback_days: 900

  # Output range of those same models: only rows in this tail are re-emitted.
  #
  # The read frame's leading edge is WARM-UP - the first bar of the frame has no
  # lag() predecessor, the first 49 have no full ma_50, the first 251 have no
  # full 252-day window. Emitting those rows would replace correct history with
  # degraded values on every run. Emitting only the tail means every written row
  # saw a complete frame, so an incremental run is bit-identical to a full
  # refresh.
  #
  # Also, the maximum the pipeline may lapse: a gap longer than this leaves dates
  # that no run ever writes. tests/assert_technicals_cover_all_bars.sql fails
  # loudly if that happens rather than leaving a silent hole.
  window_rewrite_days: 90

  # Tradability filters applied when building the training set.
  min_price: 1.0
  min_adv_usd: 1000000
