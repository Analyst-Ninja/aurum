feed_name: "ohlcv_1min"
type: "ohlcv_1min"
full_load: false
watermark_group_by: "SYMBOL"
watermark_date_column: "DATE"
input_datasource:
  type: "yahoo_ohlcv"
  name: "ohlcv_1min_source"
  interval: "1m"
  batch_size: 100
  sleep_seconds: 1
output_datasource:
  type: "postgres"
  name: "ohlcv_1min_sink"
  host: "HOST"
  port: "PORT"
  username: "AURUM_USERNAME"
  password: "AURUM_PASSWORD"
  db_name: "aurum"
  db_schema: "public"
  table: "ohlcv_1min"
  primary_key: "MD5_HASH"
  cols_for_pk:
    - "SYMBOL"
    - "DATE"
