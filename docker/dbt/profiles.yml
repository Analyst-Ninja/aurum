# Profile used inside the container only. The Dockerfile sets DBT_PROFILES_DIR to this
# directory; it deliberately does NOT live in the dbt project directory, so a dbt run on
# the host still resolves ~/.dbt/profiles.yml unchanged.
#
# Every value comes from the same env vars the ingestion and modelling configs name, so
# ECS injects credentials once and all three workloads read them.

aurum_dwh:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('HOST') }}"
      port: "{{ env_var('PORT', '5432') | int }}"
      user: "{{ env_var('AURUM_USERNAME') }}"
      password: "{{ env_var('AURUM_PASSWORD') }}"
      dbname: "{{ env_var('DB_NAME', 'aurum') }}"
      schema: bronze
      # Four. This was two, sized for the original db.t4g.micro and its 1 GB of RAM,
      # where four concurrent window-function-heavy models exhausted the instance. The
      # database is db.m7g.large now — 2 vCPU, 8 GB, non-burstable.
      #
      # Four is deliberate 2x oversubscription of two cores, NOT "one thread per vCPU":
      # m7g is Graviton3 and has no SMT, so 2 vCPU is 2 physical cores and four sessions
      # do queue. The bet is that a session is not CPU-bound the whole time — it blocks on
      # page reads, writes and WAL flushes — and that most of the 235 tests are light
      # queries where concurrency clearly wins.
      #
      # The cost of the bet is memory and disk: each backend gets its own work_mem, and
      # four concurrent window-heavy sorts spill four sets of temp files. That contributed
      # to the 2026-09-06 out-of-disk failure on mart_training_set. Watch FreeableMemory
      # and FreeStorageSpace on a scheduled build; drop to 3 if either dives.
      threads: 4
